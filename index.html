        // Language state ('en' or 'ar')

        const langToggle = document.getElementById('langToggle');
        const langBtnLabel = document.getElementById('langBtnLabel');

        function setLanguage(lang) {
            currentLang = lang;
            const htmlEl = document.documentElement;
            htmlEl.setAttribute('lang', lang);
            htmlEl.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            // Update toggle button label
            if (lang === 'ar') {
                langBtnLabel.textContent = 'EN';
                langBtnLabel.classList.remove('font-arabic');
            } else {
                langBtnLabel.textContent = 'عربي';
                langBtnLabel.classList.add('font-arabic');
            }

            // Update all bilingual elements
            const translatableElements = document.querySelectorAll('[data-en][data-ar]');
            translatableElements.forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });

            // Update localized image alt text
            document.querySelectorAll('img[data-alt-en][data-alt-ar]').forEach(img => {
                img.alt = img.getAttribute('data-alt-' + lang);
            });
        }

        langToggle.addEventListener('click', () => {
            setLanguage(currentLang === 'en' ? 'ar' : 'en');
        });

        // Clipboard helper compatible with iframe restrictions
        function copyTextToClipboard(text, message) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(message || ('Copied ' + text));
            } catch (err) {
                showToast('Handle: @Souffle.2027');
            }
            document.body.removeChild(textarea);
        }

        // Toast notification controller
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2400);
        }

        // Copy Handle Button
        const copyHandleBtn = document.getElementById('copyHandleBtn');
        const copyBadgeText = document.getElementById('copyBadgeText');
        copyHandleBtn.addEventListener('click', () => {
            const copiedToast = currentLang === 'ar' ? 'تم نسخ @Souffle.2027' : 'Copied @Souffle.2027';
            copyTextToClipboard('Souffle.2027', copiedToast);
            copyBadgeText.textContent = currentLang === 'ar' ? 'تم النسخ!' : 'Copied!';
            setTimeout(() => {
                copyBadgeText.textContent = currentLang === 'ar' ? 'نسخ' : 'Copy';
            }, 2000);
        });

        // Theme Toggle (Black on White <-> White on Black)
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // QR Code Modal Logic
        const qrBtn = document.getElementById('qrBtn');
        const qrModal = document.getElementById('qrModal');
        const qrModalCard = document.getElementById('qrModalCard');
        const closeQrBtn = document.getElementById('closeQrBtn');
        const qrTabIg = document.getElementById('qrTabIg');
        const qrTabTt = document.getElementById('qrTabTt');
        const qrImage = document.getElementById('qrImage');
        const qrPlatformLabel = document.getElementById('qrPlatformLabel');
        const copyUrlBtn = document.getElementById('copyUrlBtn');

        let currentQrUrl = 'https://www.instagram.com/Souffle.2027';

        // Shared modal open/close transitions
        function openModal(modal, card) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            });
        }

        function closeModal(modal, card) {
            modal.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 250);
        }

        qrBtn.addEventListener('click', () => openModal(qrModal, qrModalCard));
        closeQrBtn.addEventListener('click', () => closeModal(qrModal, qrModalCard));
        qrModal.addEventListener('click', (e) => {
            if (e.target === qrModal) closeModal(qrModal, qrModalCard);
        });

        qrTabIg.addEventListener('click', () => {
            currentQrUrl = 'https://www.instagram.com/Souffle.2027';
            qrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=000000&bgcolor=ffffff&data=' + encodeURIComponent(currentQrUrl);
            qrPlatformLabel.textContent = 'Instagram: @Souffle.2027';
            qrTabIg.className = 'py-2 rounded-lg bg-black text-white dark:bg-white dark:text-black transition-all';
            qrTabTt.className = 'py-2 rounded-lg opacity-60 hover:opacity-100 transition-all';
        });

        qrTabTt.addEventListener('click', () => {
            currentQrUrl = 'https://www.tiktok.com/@Souffle.2027';
            qrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=000000&bgcolor=ffffff&data=' + encodeURIComponent(currentQrUrl);
            qrPlatformLabel.textContent = 'TikTok: @Souffle.2027';
            qrTabTt.className = 'py-2 rounded-lg bg-black text-white dark:bg-white dark:text-black transition-all';
            qrTabIg.className = 'py-2 rounded-lg opacity-60 hover:opacity-100 transition-all';
        });

        copyUrlBtn.addEventListener('click', () => {
            const linkToast = currentLang === 'ar' ? 'تم نسخ رابط الحساب!' : 'Profile link copied!';
            copyTextToClipboard(currentQrUrl, linkToast);
        });

        // Photo Preview Modal Logic
        const photoModal = document.getElementById('photoModal');
        const photoModalCard = document.getElementById('photoModalCard');
        const photoModalImg = document.getElementById('photoModalImg');
        const photoModalCategory = document.getElementById('photoModalCategory');
        const photoModalTitle = document.getElementById('photoModalTitle');
        const photoModalPrice = document.getElementById('photoModalPrice');
        const closePhotoBtn = document.getElementById('closePhotoBtn');

        function setBilingualAttr(el, textObj) {
            el.setAttribute('data-en', textObj.en);
            el.setAttribute('data-ar', textObj.ar);
            el.textContent = textObj[currentLang];
        }

        function openPhotoModal(section, item) {
            photoModalImg.src = item.image;
            photoModalImg.setAttribute('data-alt-en', item.name.en);
            photoModalImg.setAttribute('data-alt-ar', item.name.ar);
            photoModalImg.alt = item.name[currentLang];
            setBilingualAttr(photoModalCategory, section.label);
            setBilingualAttr(photoModalTitle, item.name);
            setBilingualAttr(photoModalPrice, item.price);
            openModal(photoModal, photoModalCard);
        }

        closePhotoBtn.addEventListener('click', () => closeModal(photoModal, photoModalCard));
        photoModal.addEventListener('click', (e) => {
            if (e.target === photoModal) closeModal(photoModal, photoModalCard);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!photoModal.classList.contains('hidden')) closeModal(photoModal, photoModalCard);
            if (!qrModal.classList.contains('hidden')) closeModal(qrModal, qrModalCard);
        });

        // Menu Data & Renderer
        const MENU_SECTIONS = [
            {
                id: 'sweets',
                label: { en: 'Sweets', ar: 'السويت' },
                title: { en: '01 / Sweets', ar: '٠١ / السويت' },
                items: [
                    { name: { en: 'Classic Soufflé', ar: 'سوفلية كلاسيك' }, price: { en: '13 SAR', ar: '١٣ ريال' }, image: 'images/menu/classic-souffle.jpg' },
                    { name: { en: 'Oreo Soufflé', ar: 'سوفلية اوريو' }, price: { en: '14 SAR', ar: '١٤ ريال' }, image: 'images/menu/oreo-souffle.jpg' },
                    { name: { en: 'Kinder Soufflé', ar: 'سوفلية كيندر' }, price: { en: '14 SAR', ar: '١٤ ريال' }, image: 'images/menu/kinder-souffle.jpg' },
                    { name: { en: 'Hazelnut Soufflé', ar: 'سوفلية بندق' }, price: { en: '16 SAR', ar: '١٦ ريال' }, image: 'images/menu/hazelnut-souffle.jpg' },
                    { name: { en: 'Belgian Soufflé', ar: 'سوفلية بلجيكي' }, price: { en: '15 SAR', ar: '١٥ ريال' }, image: 'images/menu/belgian-souffle.jpg' },
                    { name: { en: 'Pistachio Soufflé', ar: 'سوفلية بستاشيو' }, price: { en: '14 SAR', ar: '١٤ ريال' }, image: 'images/menu/pistachio-souffle.jpg' },
                    { name: { en: 'Molten Cookies', ar: 'مولتن كوكيز' }, price: { en: '16 SAR', ar: '١٦ ريال' }, image: 'images/menu/molten-cookies.jpg' },
                    { name: { en: 'Cookies', ar: 'كوكيز' }, price: { en: '9 SAR', ar: '٩ ريال' }, image: 'images/menu/cookies.jpg' }
                ]
            },
            {
                id: 'sweet-box',
                label: { en: 'Sweet Box', ar: 'السويت بوكس' },
                title: { en: '02 / Sweet Box', ar: '٠٢ / السويت بوكس' },
                items: [
                    { name: { en: 'Classic Soufflé', ar: 'سوفلية كلاسيك' }, price: { en: '16 SAR', ar: '١٦ ريال' }, image: 'images/menu/box-classic-souffle.jpg' },
                    { name: { en: 'Oreo Soufflé', ar: 'سوفلية اوريو' }, price: { en: '17 SAR', ar: '١٧ ريال' }, image: 'images/menu/box-oreo-souffle.jpg' },
                    { name: { en: 'Kinder Soufflé', ar: 'سوفلية كيندر' }, price: { en: '17 SAR', ar: '١٧ ريال' }, image: 'images/menu/kinder-souffle.jpg' },
                    { name: { en: 'Hazelnut Soufflé', ar: 'سوفلية بندق' }, price: { en: '19 SAR', ar: '١٩ ريال' }, image: 'images/menu/hazelnut-souffle.jpg' },
                    { name: { en: 'Belgian Soufflé', ar: 'سوفلية بلجيكي' }, price: { en: '18 SAR', ar: '١٨ ريال' }, image: 'images/menu/belgian-souffle.jpg' },
                    { name: { en: 'Pistachio Soufflé', ar: 'سوفلية بستاشيو' }, price: { en: '17 SAR', ar: '١٧ ريال' }, image: 'images/menu/pistachio-souffle.jpg' }
                ]
            },
            {
                id: 'drip-coffee',
                label: { en: 'Drip Coffee', ar: 'القهوة المقطرة' },
                title: { en: '03 / Drip Coffee', ar: '٠٣ / القهوة المقطرة' },
                items: [
                    { name: { en: 'Coffee of the Day', ar: 'قهوة اليوم' }, price: { en: '5 / 7 SAR', ar: '٥ / ٧ ريال' }, image: 'images/menu/coffee-of-the-day.jpg' },
                    { name: { en: 'V60 Ethiopian', ar: 'V60 إثيوبي' }, price: { en: '9 SAR', ar: '٩ ريال' }, image: 'images/menu/v60-ethiopian.jpg' },
                    { name: { en: 'V60 Colombian', ar: 'V60 كولومبي' }, price: { en: '9 SAR', ar: '٩ ريال' }, image: 'images/menu/v60-premium.jpg' },
                    { name: { en: 'V60 Yemeni Crop', ar: 'V60 محصول يمني' }, price: { en: '14 SAR', ar: '١٤ ريال' }, image: 'images/menu/v60-ethiopian.jpg' },
                    { name: { en: 'V60 Premium Crop', ar: 'V60 محصول فاخر' }, price: { en: '16 SAR', ar: '١٦ ريال' }, image: 'images/menu/v60-premium.jpg' }
                ]
            }
        ];

        const TAB_BASE_CLASS = 'menu-tab shrink-0 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider border transition-all';
        const TAB_ACTIVE_CLASS = `${TAB_BASE_CLASS} active-tab border-black dark:border-white bg-black text-white dark:bg-white dark:text-black`;
        const TAB_INACTIVE_CLASS = `${TAB_BASE_CLASS} border-black/20 dark:border-white/20 hover:border-black dark:hover:border-white`;

        function createBilingualEl(tag, className, textObj) {
            const el = document.createElement(tag);
            el.className = className;
            setBilingualAttr(el, textObj);
            return el;
        }

        function createMenuItemCard(section, item) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'group w-full p-3 rounded-2xl border border-black/10 dark:border-white/10 bg-black/[0.015] dark:bg-white/[0.02] hover:border-black/40 dark:hover:border-white/40 transition-colors flex items-center justify-between gap-3.5 text-start cursor-pointer';
            card.addEventListener('click', () => openPhotoModal(section, item));

            const info = document.createElement('div');
            info.className = 'flex items-center gap-3.5 min-w-0';

            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'relative w-16 h-16 shrink-0 rounded-xl overflow-hidden border border-black/10 dark:border-white/10 bg-black/[0.04] dark:bg-white/[0.06]';

            const img = document.createElement('img');
            img.src = item.image;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.className = 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-300';
            img.setAttribute('data-alt-en', item.name.en);
            img.setAttribute('data-alt-ar', item.name.ar);
            img.alt = item.name[currentLang];
            thumbWrap.appendChild(img);

            const titleWrap = document.createElement('div');
            titleWrap.className = 'min-w-0';
            titleWrap.appendChild(createBilingualEl('h4', 'font-bold text-sm tracking-tight leading-snug', item.name));

            if (section.id === 'sweet-box') {
                titleWrap.appendChild(createBilingualEl('span', 'inline-block mt-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-black/[0.06] dark:bg-white/[0.1] opacity-75', { en: 'Box', ar: 'بوكس' }));
            }

            info.appendChild(thumbWrap);
            info.appendChild(titleWrap);
            card.appendChild(info);
            card.appendChild(createBilingualEl('span', 'font-mono font-bold text-sm shrink-0', item.price));
            return card;
        }

        function renderMenu() {
            const tabsEl = document.getElementById('menuTabs');
            const groupsEl = document.getElementById('menuGroups');
            tabsEl.replaceChildren();
            groupsEl.replaceChildren();

            const allTab = createBilingualEl('button', TAB_ACTIVE_CLASS, { en: 'All', ar: 'الكل' });
            allTab.setAttribute('data-category', 'all');
            allTab.setAttribute('role', 'tab');
            allTab.setAttribute('aria-selected', 'true');
            tabsEl.appendChild(allTab);

            MENU_SECTIONS.forEach(section => {
                const tab = createBilingualEl('button', TAB_INACTIVE_CLASS, section.label);
                tab.setAttribute('data-category', section.id);
                tab.setAttribute('role', 'tab');
                tab.setAttribute('aria-selected', 'false');
                tabsEl.appendChild(tab);

                const group = document.createElement('div');
                group.className = 'menu-group space-y-2.5';
                group.setAttribute('data-group', section.id);

                const header = document.createElement('div');
                header.className = 'flex items-center justify-between border-b border-black/15 dark:border-white/15 pb-2 mb-3';
                header.appendChild(createBilingualEl('h3', 'text-xs font-bold uppercase tracking-[0.15em]', section.title));
                group.appendChild(header);

                section.items.forEach(item => {
                    group.appendChild(createMenuItemCard(section, item));
                });

                groupsEl.appendChild(group);
            });
        }

        renderMenu();

        // Menu Category Tabs Filter Logic
        const menuTabs = document.querySelectorAll('.menu-tab');
        const menuGroups = document.querySelectorAll('.menu-group');

        menuTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const selectedCategory = tab.getAttribute('data-category');

                menuTabs.forEach(t => {
                    const isActive = t === tab;
                    t.className = isActive ? TAB_ACTIVE_CLASS : TAB_INACTIVE_CLASS;
                    t.setAttribute('aria-selected', String(isActive));
                });

                menuGroups.forEach(group => {
                    const isVisible = selectedCategory === 'all' || group.getAttribute('data-group') === selectedCategory;
                    group.classList.toggle('hidden', !isVisible);
                });
            });
        });
    </script>
</body>
</html>
